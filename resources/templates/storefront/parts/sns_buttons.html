<div class="sns-buttons">
    <p class="sns-divider"><span>または</span></p>
    {% for button in sns.buttons %}
        <a class="sns-button sns-{{ button.provider }}" href="{{ button.start_url }}">
            {% if button.provider == "line" %}
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3C6.5 3 2.5 6.7 2.5 11.2c0 4.1 3.7 7.5 8.6 8 .4 0 .8.1 1 .3.1.2.2.4.2.7l.1 1.7c0 .5.5.8.9.5 2.3-1.4 8.2-5.2 8.2-11.2C21.5 6.7 17.5 3 12 3Z"/><path fill="#06C755" d="M6.6 9.6h5.2v1.6H6.6zM6.6 12h5.2v1.6H6.6zM14.2 9.6h3.4v1.6h-3.4zM14.2 12h3.4v1.6h-3.4z"/></svg>
            {% else if button.provider == "google" %}
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.2H12v4.3h6.5c-.1 1.1-.8 2.7-2.4 3.8l3.7 2.9c2.3-2.1 3.7-5.1 3.7-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.7-2.9c-1 .7-2.4 1.2-4.2 1.2-3.2 0-5.9-2.2-6.8-5.1L1.3 17.2C3.3 21.2 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3L1.3 6.8C.5 8.4 0 10.1 0 12s.5 3.6 1.3 5.2l3.9-2.9z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.3 0 3.3 2.8 1.3 6.8l3.9 2.9c.9-2.9 3.6-5 6.8-5z"/></svg>
            {% else %}
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3.5 10 9.8l5.5-6.3"/><path d="M10 9.8v9.7"/></svg>
            {% endif %}
            <span>{{ button.label }}</span>
        </a>
    {% endfor %}
</div>
