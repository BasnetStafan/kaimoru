{% extends "storefront/layouts/base.html" %}

{% block homepart %}
    <section class="cart-page">
        <ol class="steps">
            <li class="active" aria-current="step"><span class="step-num">1</span>カート</li>
            <li><span class="step-num">2</span>お客様情報</li>
            <li><span class="step-num">3</span>お支払い方法</li>

            <li><span class="step-num">5</span>完了</li>

        <h1>ショッピングカート</h1>
        <div id="cart-main">
            {% include "storefront/parts/cart_main.html" %}
        </div>
    </section>
{% endblock %}
