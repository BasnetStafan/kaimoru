{% extends "storefront/layouts/base.html" %}

{% block title %}{{ header.shop.shop_name }} | 2段階認証{% endblock %}

{% block homepart %}
    <section class="auth-page">
        <h1>2段階認証</h1>

        <p>認証アプリに表示される6桁のコードを入力してください。<br>
        アプリを使えない場合は、リカバリーコードでもログインできます。</p>

        {% if let Some(message) = error %}
            <p class="form-error">{{ message }}</p>
        {% endif %}

        <form method="post" action="/login/totp" class="auth-form">
            <label>
                認証コード <span class="badge-required">必須</span>
                <input type="text" name="code" autocomplete="one-time-code" aria-required="true" class="code-input">
            </label>
            <button type="submit" class="primary-button">ログイン</button>
        </form>
    </section>
{% endblock %}
