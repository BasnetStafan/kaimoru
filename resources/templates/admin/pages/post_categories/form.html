{% extends "admin/layouts/admin.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block adminpart %}
<p class="admin-back"><a href="/admin/post-categories">← カテゴリ一覧に戻る</a></p>
<h1 class="admin-h1">{{ heading }}</h1>

<form method="post" action="{{ action }}" class="admin-form" data-unsaved-guard>
<input type="hidden" name="form_ticket" value="{{ form_ticket }}">
    <section class="admin-form-section">
        <h2 class="admin-form-section-title">基本情報</h2>
        <label>カテゴリ名 <span class="badge-required">必須</span>
            <input type="text" name="name" value="{{ values.name }}" maxlength="50" placeholder="例：お知らせ" aria-required="true">
            {% if let Some(message) = name_error %}
            <span class="field-error">{{ message }}</span>
            {% endif %}
        </label>
        <label>スラッグ <span class="badge-required">必須</span>
            <input type="text" name="slug" value="{{ values.slug }}" maxlength="50" placeholder="例：news" aria-required="true">
            <span class="admin-field-help">URL「/blog/category/スラッグ」の一部になります。半角英小文字・数字・ハイフン。</span>
            {% if let Some(message) = slug_error %}
            <span class="field-error">{{ message }}</span>
            {% endif %}
        </label>
    </section>

    <div class="admin-form-actions">
        <p class="admin-unsaved-note" data-unsaved-note hidden>未保存の変更があります</p>
        <button type="submit" class="primary-button">保存する</button>
        <a class="secondary-button" href="/admin/post-categories">キャンセル</a>
    </div>
</form>

{% if let Some(url) = delete_url %}
<form method="post" action="{{ url }}" class="post-category-delete-form">
    <button type="submit" class="secondary-button danger">このカテゴリを削除する</button>
</form>
{% endif %}
{% endblock %}
