[package]
name = "mcp-defs"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
schemars = { version = "1.2.3", features = ["derive"] }
# Only the schema helpers and the tool model: the listing
# built here must come from the same code the app's HTTP
# router generates its listing with.
rmcp = { version = "3.12.0", features = ["server"] }
