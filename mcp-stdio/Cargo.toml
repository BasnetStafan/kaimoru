[package]
name = "mcp-stdio"
version = "0.1.0"
edition = "2024"

[dependencies]
# The shared tool definitions: the listing this adapter
# serves is the HTTP server's own, from the one source.
mcp-defs = { path = "../mcp-defs" }
rmcp = { version = "3.12.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
# The upstream HTTP client: the workspace's one approved
# client shape (session decision 2026-11-03), the same as
# the app's KOMOJU client — rustls, JSON bodies.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
# Log output goes to stderr only: stdout is the protocol
# channel and must carry nothing but JSON-RPC.
tracing-subscriber = { version = "0.3", features = ["fmt"] }
